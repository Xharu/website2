<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Website 1 - Examen SCO420</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            max-width: 600px;
            width: 100%;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        h1 {
            color: #2c3e50;
            text-align: center;
            margin-bottom: 30px;
            font-size: 1.8em;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 2px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .divider {
            height: 3px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            border: none;
            border-radius: 2px;
            margin: 25px 0;
        }

        .info-section {
            background: rgba(102, 126, 234, 0.05);
            padding: 25px;
            border-radius: 15px;
            margin: 20px 0;
            border-left: 5px solid #667eea;
        }

        .info-item {
            margin: 15px 0;
            display: flex;
            align-items: center;
        }

        .info-label {
            font-weight: 700;
            color: #2c3e50;
            min-width: 120px;
            font-size: 0.95em;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .info-value {
            color: #34495e;
            font-size: 1em;
            margin-left: 15px;
        }

        .highlight {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            padding: 3px 8px;
            border-radius: 6px;
            font-weight: 600;
        }

        .header-icon {
            display: inline-block;
            width: 12px;
            height: 12px;
            background: #667eea;
            border-radius: 50%;
            margin-right: 10px;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .container {
            animation: fadeIn 0.8s ease-out;
        }

        .info-item:hover {
            transform: translateX(5px);
            transition: transform 0.3s ease;
        }

        @media (max-width: 480px) {
            .container {
                padding: 25px;
            }
            
            h1 {
                font-size: 1.4em;
            }
            
            .info-item {
                flex-direction: column;
                align-items: flex-start;
            }
            
            .info-value {
                margin-left: 0;
                margin-top: 5px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>
            <span class="header-icon"></span>
            PRIMER PARCIAL PARTE PRÁCTICA - SCO420
        </h1>
        
        <div class="divider"></div>
        
        <div class="info-section">
            <div class="info-item">
                <span class="info-label">DOCENTE:</span>
                <span class="info-value">Ing. Arenas Porcel Marco Antonio</span>
            </div>
            
            <div class="info-item">
                <span class="info-label">Universitario:</span>
                <span class="info-value highlight">Mauricio Torrejon Miguel Angel</span>
            </div>
            
            <div class="info-item">
                <span class="info-label">CARRERA:</span>
                <span class="info-value">Ing. Tecnologías de la Información y Seguridad</span>
            </div>
            
            <div class="info-item">
                <span class="info-label">FECHA:</span>
                <span class="info-value">25/09/2025</span>
            </div>
        </div>
        
        <div class="divider"></div>
    </div>
</body>
</html>
